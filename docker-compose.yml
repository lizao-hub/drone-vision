name: drone-demo

# 容器链路：
#   Windows FFmpeg ──RTMP──▶ drone1 ─┐
#                                    ├─▶ MediaMTX ──WebRTC──▶ 浏览器
#   worker：drone1 ──RTSP──▶ 算法 ──RTMP──▶ drone1_yolo ─┘
#   frontend(nginx :8080) ──/api──▶ backend ──Docker socket──▶ worker 容器（启停）
#
# 浏览器播放页：
#   http://localhost:8080            控制台
#   http://localhost:8889/drone1     原画
#   http://localhost:8889/drone1_yolo 检测画

services:
  mediamtx:
    # 如 1.21.3 拉取失败，可改用 bluenviron/mediamtx:1
    image: bluenviron/mediamtx:1.21.3
    container_name: drone-mediamtx
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./deploy/mediamtx/mediamtx.yml:/mediamtx.yml:ro

  backend:
    build:
      context: ./backend
      network: host
    image: drone-backend:dev
    container_name: drone-backend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    volumes:
      # 允许后端启停 drone-worker；仅限本机演示，注意权限。
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      MEDIAMTX_API: http://127.0.0.1:9997
      WORKER_CONTAINER: drone-worker

  frontend:
    build:
      context: ./frontend
      network: host
    image: drone-frontend:dev
    container_name: drone-frontend
    network_mode: host
    restart: unless-stopped
    depends_on:
      - backend

  worker:
    build:
      context: ./worker
      # 构建阶段要访问 PyPI 镜像，走 host 网络更稳
      network: host
    image: drone-worker:dev
    container_name: drone-worker
    network_mode: host
    restart: unless-stopped
    depends_on:
      - mediamtx
    # 拉 drone1、跑算法、推 drone1_yolo。GPU 已启用（需服务器安装
    # NVIDIA Container Toolkit）；三个 worker 各自钉一张卡，没有 CPU 回退。
    environment:
      DRONE_SOURCE: ${DRONE_SOURCE:-rtsp://127.0.0.1:8554/drone1}
      DRONE_DEST: ${DRONE_DEST:-rtmp://127.0.0.1:1935/drone1_yolo}
    # 帧缓冲走 /dev/shm（1080p、window=4 约 315MB），容器默认只有
    # 64MB，不放开会在创建共享内存时 ENOSPC。
    shm_size: "512mb"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./worker/models:/app/models:ro
      - ./worker/videos:/app/videos:ro
      - ./worker/output:/app/output
    command:
      - relay
      - --source
      - ${DRONE_SOURCE:-rtsp://127.0.0.1:8554/drone1}
      - --dest
      - ${DRONE_DEST:-rtmp://127.0.0.1:1935/drone1_yolo}
