[project]
name = "drone-worker"
version = "0.1.0"
description = "Drone vision worker: segment the viaduct deck, then detect vehicles on it"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy==2.5.4",
    "opencv-python==5.0.0.93",
    "torch==2.14.0",
    "ultralytics==8.4.183",
    "lap>=0.5.12",
]

# The shell CLI lands with phase 1b; there is no console script until then.

[project.optional-dependencies]
container = ["imageio-ffmpeg==0.6.0"]
dev = ["pytest>=8.4", "opencv-python-headless>=4.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/drone_worker", "src/algorithm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
